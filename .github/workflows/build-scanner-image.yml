name: Build Scanner Image
on:
  push:
    branches: [main]
    paths:
      - "vaultline-app/worker/docker/**"
      - "vaultline-app/worker/Dockerfile.scanner"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./vaultline-app/worker
          file: ./vaultline-app/worker/Dockerfile.scanner
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vaultline-scanner:latest